#
# mcpmux configuration — one example per auth type.
#
# ${ENV_VAR} references are expanded from the process environment at load time,
# so secrets stay out of this file. Keep real secrets in your shell/keychain.
# Note: a literal "$" in a value is interpreted as an environment reference, so
# put any secret containing "$" in an env var and reference it as ${VAR}.

listen:
  # How the single proxy endpoint is exposed: "stdio" or "http".
  transport: http
  # host:port to bind (http transport only).
  address: "127.0.0.1:8080"
  # URL path the MCP endpoint is mounted at (http transport only).
  # Clients connect to http://127.0.0.1:8080/mcp
  path: /mcp

backends:
  # 1. Local subprocess (stdio). Secrets are passed via env.
  - name: files
    # Optional free-text context for the client's model. mcpmux front-loads it
    # onto this backend's tool descriptions and lists it in the server
    # instructions — handy to disambiguate multiple backends of the same kind
    # (e.g. several AWS profiles).
    description: "Local filesystem server rooted at /data."
    transport: command
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/data"]
    env:
      SOME_TOKEN: ${SOME_TOKEN}

  # 2. Remote HTTP backend, no authentication.
  - name: public
    transport: http
    endpoint: https://public.example.com/mcp
    auth:
      type: none

  # 3. Remote HTTP backend with a static bearer token.
  - name: service-a
    transport: http
    endpoint: https://service-a.example.com/mcp
    auth:
      type: bearer
      token: ${SERVICE_A_TOKEN}

  # 4. Remote HTTP backend with a custom header.
  - name: service-b
    transport: http
    endpoint: https://service-b.example.com/mcp
    auth:
      type: header
      header: X-Api-Key
      value: ${SERVICE_B_API_KEY}

  # 5. Remote HTTP backend whose bearer token is minted by a credential helper.
  #    The command's stdout is used as the token and re-run when it nears expiry
  #    (a JWT "exp" claim is honored; "ttl" caps caching for opaque tokens).
  #    Ideal for CLIs that already hold a login — no browser, ever.
  - name: service-c
    transport: http
    endpoint: https://service-c.example.com/mcp
    auth:
      type: command
      command: ["my-cli", "auth", "token", "--audience", "https://service-c.example.com/mcp"]
      # ttl: 5m   # optional; only used for non-JWT tokens

  # 6. Remote HTTP backend using interactive OAuth (authorization-code + PKCE,
  #    dynamic client registration). A browser opens once when the daemon starts;
  #    tokens (and refresh, if issued) are held in memory for the daemon's life.
  - name: service-d
    transport: http
    endpoint: https://service-d.example.com/mcp
    auth:
      type: oauth
      # scopes: []           # optional requested scopes
      # client_name: mcpmux  # shown on the consent screen
      # open_browser: true   # false = just log the URL (headless/SSH)
      # callback_port: 0     # 0 = ephemeral loopback port
