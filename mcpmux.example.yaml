# mcpmux configuration.
#
# ${ENV_VAR} references are expanded from the process environment at load time,
# so secrets stay out of this file. Keep real secrets in your shell/keychain.

listen:
  # How the single proxy endpoint is exposed: "stdio" or "http".
  transport: http
  # host:port to bind (http transport only).
  address: "127.0.0.1:8080"
  # URL path the MCP endpoint is mounted at (http transport only).
  # Clients connect to http://127.0.0.1:8080/mcp
  path: /mcp

backends:
  # A backend launched as a local subprocess (stdio). Secrets are passed via env.
  - name: linear
    transport: command
    command: ["npx", "-y", "mcp-remote", "https://mcp.linear.app/sse"]
    env:
      LINEAR_API_KEY: ${LINEAR_API_KEY}

  # A remote streamable-HTTP backend authenticated with a bearer token.
  - name: github
    transport: http
    endpoint: https://api.example.com/mcp
    auth:
      type: bearer
      token: ${GITHUB_TOKEN}

  # A remote backend authenticated with a custom header.
  - name: internal
    transport: http
    endpoint: https://internal.example.com/mcp
    auth:
      type: header
      header: X-Api-Key
      value: ${INTERNAL_API_KEY}

  # A remote backend whose bearer token is minted by a credential helper. The
  # command's stdout is used as the token and re-run when it nears expiry (its
  # JWT "exp" claim is honored; "ttl" caps caching for opaque tokens). This is
  # the non-interactive path for CLIs that already hold a login.
  - name: chainguard-apk
    transport: http
    endpoint: https://apk.cgr.dev/mcp
    auth:
      type: command
      command: ["chainctl", "auth", "token", "--audience", "https://apk.cgr.dev/mcp"]
      # ttl: 5m   # optional; only used for non-JWT tokens

  # A backend using interactive OAuth (authorization-code + PKCE, dynamic client
  # registration). A browser opens once when the daemon starts; tokens (and
  # refresh, if issued) are held in memory for the daemon's lifetime.
  - name: linear
    transport: http
    endpoint: https://mcp.linear.app/mcp
    auth:
      type: oauth
      # scopes: []           # optional requested scopes
      # client_name: mcpmux  # shown on the consent screen
      # open_browser: true   # false = just log the URL (headless/SSH)
      # callback_port: 0     # 0 = ephemeral loopback port
